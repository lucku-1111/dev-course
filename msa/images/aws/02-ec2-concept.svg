<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#232F3E">EC2 = AWS 데이터센터에 있는 컴퓨터를 빌려 쓰는 것</text>

  <!-- connectors -->
  <g stroke="#BDBDBD" stroke-width="2">
    <line x1="330" y1="110" x2="370" y2="200"/>
    <line x1="330" y1="240" x2="370" y2="240"/>
    <line x1="330" y1="370" x2="370" y2="280"/>
    <line x1="670" y1="110" x2="630" y2="200"/>
    <line x1="670" y1="240" x2="630" y2="240"/>
    <line x1="670" y1="370" x2="630" y2="280"/>
  </g>

  <!-- center -->
  <rect x="370" y="160" width="260" height="160" rx="16" fill="#FFF3E0" stroke="#FF9900" stroke-width="3"/>
  <rect x="440" y="182" width="120" height="16" rx="3" fill="#FF9900" opacity="0.35"/>
  <text x="500" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">EC2 인스턴스</text>
  <text x="500" y="256" text-anchor="middle" font-size="15" fill="#444">(가상 서버 1대)</text>
  <text x="500" y="288" text-anchor="middle" font-size="14" fill="#888">우리 실습: msa-app, msa-db</text>

  <g font-size="13">
    <!-- left cards -->
    <rect x="20" y="60" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="40" y="90" font-size="16" font-weight="bold" fill="#232F3E">AMI — 설치할 OS</text>
    <text x="40" y="115" fill="#444">Ubuntu Server 24.04 LTS</text>
    <text x="40" y="140" fill="#888">비유: 윈도우 설치 USB</text>

    <rect x="20" y="190" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="40" y="220" font-size="16" font-weight="bold" fill="#232F3E">인스턴스 유형 — 사양</text>
    <text x="40" y="245" fill="#444">t3.small = vCPU 2개 · 메모리 2GB</text>
    <text x="40" y="270" fill="#888">비유: 노트북 사양 (CPU / RAM)</text>

    <rect x="20" y="320" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="40" y="350" font-size="16" font-weight="bold" fill="#232F3E">EBS — 저장 공간</text>
    <text x="40" y="375" fill="#444">기본 8GB 디스크 (늘릴 수 있음)</text>
    <text x="40" y="400" fill="#888">비유: SSD / 하드디스크</text>

    <!-- right cards -->
    <rect x="670" y="60" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="690" y="90" font-size="16" font-weight="bold" fill="#232F3E">키 페어 — 접속 열쇠</text>
    <text x="690" y="115" fill="#444">msa-key.pem (딱 한 번만 다운로드)</text>
    <text x="690" y="140" fill="#888">비유: 현관 열쇠</text>

    <rect x="670" y="190" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="690" y="220" font-size="16" font-weight="bold" fill="#232F3E">보안 그룹 — 방화벽</text>
    <text x="690" y="245" fill="#444">22(SSH), 80(HTTP) 등 열 포트 지정</text>
    <text x="690" y="270" fill="#888">비유: 현관 도어락</text>

    <rect x="670" y="320" width="310" height="100" rx="10" fill="#F5F5F5" stroke="#BDBDBD"/>
    <text x="690" y="350" font-size="16" font-weight="bold" fill="#232F3E">IP 주소 — 서버 주소</text>
    <text x="690" y="375" fill="#444">사설 IP(내부) · 공인 IP · EIP(고정)</text>
    <text x="690" y="400" fill="#888">비유: 집 주소</text>
  </g>

  <text x="500" y="455" text-anchor="middle" font-size="14" fill="#444">EC2를 만든다 = 이 6가지를 골라서 "컴퓨터 한 대 주세요" 하고 주문하는 것</text>
</svg>
