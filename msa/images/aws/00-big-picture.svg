<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9E9E9E"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#232F3E">복잡해 보여도 결국 4단계 — 지금 어디쯤인지만 알면 된다</text>

  <g font-size="13" text-anchor="middle">
    <!-- 1 -->
    <rect x="15" y="60" width="225" height="215" rx="14" fill="#EDE7F6" stroke="#8C4FFF" stroke-width="2"/>
    <circle cx="127" cy="92" r="18" fill="#8C4FFF"/><text x="127" y="99" font-size="18" font-weight="bold" fill="#fff">1</text>
    <text x="127" y="137" font-size="18" font-weight="bold" fill="#232F3E">땅 고르고 집 짓기</text>
    <text x="127" y="162" fill="#444">VPC · 서브넷 · 게이트웨이</text>
    <text x="127" y="182" fill="#444">보안그룹 · EC2 2대</text>
    <text x="127" y="207" fill="#6A1B9A" font-weight="bold">어디서? AWS 콘솔 (마우스)</text>
    <line x1="35" y1="222" x2="220" y2="222" stroke="#D1C4E9"/>
    <text x="127" y="243" fill="#333">확인: ssh 접속 성공</text>
    <text x="127" y="263" fill="#888">5 · 6장 (09.28)</text>

    <!-- 2 -->
    <rect x="265" y="60" width="225" height="215" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
    <circle cx="377" cy="92" r="18" fill="#1E88E5"/><text x="377" y="99" font-size="18" font-weight="bold" fill="#fff">2</text>
    <text x="377" y="137" font-size="18" font-weight="bold" fill="#232F3E">창고(DB) 채우기</text>
    <text x="377" y="162" fill="#444">msa-db 에 MySQL 설치</text>
    <text x="377" y="182" fill="#444">DB · app 계정 만들기</text>
    <text x="377" y="207" fill="#1565C0" font-weight="bold">어디서? msa-db 터미널</text>
    <line x1="285" y1="222" x2="470" y2="222" stroke="#BBDEFB"/>
    <text x="377" y="243" fill="#333">확인: mysql -h 접속 성공</text>
    <text x="377" y="263" fill="#888">7장 (09.28)</text>

    <!-- 3 -->
    <rect x="515" y="60" width="225" height="215" rx="14" fill="#FFF3E0" stroke="#FF9900" stroke-width="2"/>
    <circle cx="627" cy="92" r="18" fill="#FF9900"/><text x="627" y="99" font-size="18" font-weight="bold" fill="#fff">3</text>
    <text x="627" y="137" font-size="18" font-weight="bold" fill="#232F3E">가게(앱) 입주</text>
    <text x="627" y="162" fill="#444">msa-app 에 Docker · Git</text>
    <text x="627" y="182" fill="#444">.env 작성 → ./deploy.sh</text>
    <text x="627" y="207" fill="#E65100" font-weight="bold">어디서? msa-app 터미널</text>
    <line x1="535" y1="222" x2="720" y2="222" stroke="#FFE0B2"/>
    <text x="627" y="243" fill="#333">확인: curl 127.0.0.1:8080</text>
    <text x="627" y="263" fill="#888">8장 (09.29)</text>

    <!-- 4 -->
    <rect x="765" y="60" width="220" height="215" rx="14" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
    <circle cx="875" cy="92" r="18" fill="#43A047"/><text x="875" y="99" font-size="18" font-weight="bold" fill="#fff">4</text>
    <text x="875" y="137" font-size="18" font-weight="bold" fill="#232F3E">대문(Nginx) 달기</text>
    <text x="875" y="162" fill="#444">:80 으로 받아서</text>
    <text x="875" y="182" fill="#444">web / edge 로 전달</text>
    <text x="875" y="207" fill="#2E7D32" font-weight="bold">어디서? msa-app 터미널</text>
    <line x1="785" y1="222" x2="965" y2="222" stroke="#C8E6C9"/>
    <text x="875" y="243" fill="#333">확인: 브라우저 http://EIP</text>
    <text x="875" y="263" fill="#888">9장 (09.29)</text>
  </g>

  <g stroke="#9E9E9E" stroke-width="3" marker-end="url(#a)">
    <line x1="241" y1="167" x2="262" y2="167"/>
    <line x1="491" y1="167" x2="512" y2="167"/>
    <line x1="741" y1="167" x2="762" y2="167"/>
  </g>

  <text x="500" y="305" text-anchor="middle" font-size="14" fill="#444">막히면 → "몇 번 단계의 확인이 안 되는지"부터 찾고, 그 단계만 다시 보기 (12장 트러블슈팅)</text>
</svg>
